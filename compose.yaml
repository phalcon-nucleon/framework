# Development environment for Nucleon 2.x.
#
#   docker compose run --rm php8 composer install
#   docker compose run --rm php8 vendor/bin/phpunit
#   PHP_VERSION=8.4 docker compose build php8
services:
  php8:
    build:
      context: docker/php8
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
    volumes:
      - .:/app
    environment:
      DB_MYSQL_HOST: mysql
      DB_PGSQL_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      - mysql
      - postgres
      - redis

  # Nucleon 1.3 reference (PHP 7.3 + Phalcon 3.4), for baseline benchmarks only.
  legacy:
    build: docker/legacy
    profiles: [legacy]
    volumes:
      - .:/app

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nucleon
    tmpfs: /var/lib/mysql

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nucleon
    tmpfs: /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
